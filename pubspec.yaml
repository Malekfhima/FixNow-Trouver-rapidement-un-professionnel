name: fixnow
description: FixNow - Marketplace locale de services à domicile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+2
  cloud_functions: ^5.2.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # UI & Display
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  badges: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Images & Location
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Utils
  uuid: ^4.3.3
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  firebase_auth_mocks: ^0.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts: Poppins is set as fontFamily in app_theme.dart.
  # To use custom fonts, download from https://fonts.google.com/specimen/Poppins
  # and place .ttf files in assets/fonts/, then uncomment below:
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
