name: fixnow
description: FixNow - Marketplace locale de services à domicile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+2
  cloud_functions: ^5.2.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Connectivity (bandeau hors-ligne)
  connectivity_plus: ^6.0.5

  # UI & Display
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  badges: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Images & Location
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Utils
  uuid: ^4.3.3
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  firebase_auth_mocks: ^0.14.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts: Poppins is set as fontFamily in app_theme.dart.
  # To use custom fonts, download from https://fonts.google.com/specimen/Poppins
  # and place .ttf files in assets/fonts/, then uncomment below:
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700

# App launcher icon — generated from assets/icon/fixnow_icon.png
# (source keeps transparent margins; *_full.png is the opaque composite
# produced by tool/make_icon_bg.mjs). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/fixnow_icon_full.png"
  # Adaptive icon : artwork pleine page, sans inset (logo déjà centré).
  adaptive_icon_background: "assets/icon/fixnow_icon_full.png"
  adaptive_icon_foreground: "assets/icon/fixnow_icon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#0248BE"
  web:
    generate: true
    image_path: "assets/icon/fixnow_icon_full.png"
    background_color: "#0248BE"
    theme_color: "#0248BE"
  windows:
    generate: true
    image_path: "assets/icon/fixnow_icon_full.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/fixnow_icon_full.png"
