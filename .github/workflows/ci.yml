name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Annule les runs obsolètes d'une même branche / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Aligné sur la version stable locale (voir pubspec: >= 3.16.0).
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    # Job optionnel : les règles et l'émulateur ne dépendent pas de la
    # compilation Flutter, mais un échec doit bloquer la merge → continue-on-error: false.
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests (Firestore emulator)
        run: npm run test:rules
